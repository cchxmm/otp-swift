name: Build iOS IPA (Swift)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen
        timeout-minutes: 5

      - name: Create project.yml
        run: |
          cat > project.yml << 'EOF'
          name: OTPAuthenticator
          options:
            bundleIdPrefix: com.zkay
            xcodeVersion: "14.0"
            deploymentTarget:
              iOS: "15.0"
          targets:
            OTPAuthenticator:
              type: application
              platform: iOS
              sources:
                - path: OTPAuthenticator
              info:
                path: OTPAuthenticator/Info.plist
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.zkay.OTPAuthenticator
                  MARKETING_VERSION: "1.0"
                  CURRENT_PROJECT_VERSION: "1"
                  TARGETED_DEVICE_FAMILY: "1"
                  SUPPORTS_MACCATALYST: NO
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO
                  INFOPLIST_FILE: OTPAuthenticator/Info.plist
          EOF

      - name: Generate Xcode Project
        run: xcodegen generate
        timeout-minutes: 3

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project OTPAuthenticator.xcodeproj \
            -scheme OTPAuthenticator \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build.log | tail -100
          echo "---EXIT CODE: ${PIPESTATUS[0]}---"
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "BUILD FAILED - showing errors:"
            grep -i "error:" build.log | head -30
            exit 1
          fi
        timeout-minutes: 10

      - name: Package IPA
        run: |
          APP_PATH=$(find build -name "OTPAuthenticator.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: OTPAuthenticator.app not found"
            find build -name "*.app" -type d
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r OTPAuthenticator.ipa Payload
          ls -la OTPAuthenticator.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v5
        with:
          name: otp-swift-ipa
          path: OTPAuthenticator.ipa
