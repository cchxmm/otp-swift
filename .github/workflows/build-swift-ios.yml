name: Build iOS IPA (Swift)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_14.3.1.app/Contents/Developer || \
          sudo xcode-select -s /Applications/Xcode_14.app/Contents/Developer
          xcodebuild -version

      - name: Create project.yml
        run: |
          cat > project.yml << 'EOF'
          name: OTPAuthenticator
          options:
            bundleIdPrefix: com.zkay
            deploymentTarget:
              iOS: "15.0"
          targets:
            OTPAuthenticator:
              type: application
              platform: iOS
              sources:
                - path: OTPAuthenticator
              info:
                path: OTPAuthenticator/Info.plist
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.zkay.OTPAuthenticator
                  MARKETING_VERSION: "1.0"
                  CURRENT_PROJECT_VERSION: "1"
                  TARGETED_DEVICE_FAMILY: "1"
                  SUPPORTS_MACCATALYST: NO
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO
                  INFOPLIST_FILE: OTPAuthenticator/Info.plist
          EOF
          cat project.yml

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate
          ls -la OTPAuthenticator.xcodeproj

      - name: Build
        run: |
          xcodebuild -project OTPAuthenticator.xcodeproj \
            -scheme OTPAuthenticator \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/OTPAuthenticator.app"
          if [ -d "$APP_PATH" ]; then
            mkdir -p Payload
            cp -R "$APP_PATH" Payload/
            zip -r OTPAuthenticator.ipa Payload
            ls -la OTPAuthenticator.ipa
          else
            echo "App not found at $APP_PATH"
            find build -name "*.app" -type d 2>/dev/null || true
            exit 1
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: otp-swift-ipa
          path: OTPAuthenticator.ipa
